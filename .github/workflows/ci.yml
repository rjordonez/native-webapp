name: CI Testing Pipeline

on:
  push:
    branches: [develop, main]     
  pull_request:
    branches: [develop, main]    

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'develop' || github.base_ref == 'main'))
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e-tests:
    name: E2E Tests
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e

  deploy-to-vercel:
    name: Deploy to Vercel
    needs: integration-tests
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' &&
      (github.base_ref == 'main' || github.base_ref == 'develop'))
    steps:
      - uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy (dynamic)
        env:
          # Vercel needs these three vars only
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}     # e.g. rnordones-projects
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }} # e.g. prj_xG9y...
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "🔵 Deploying to production..."
            vercel --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --prod --confirm
          else
            echo "🟡 Deploying to preview..."
            vercel --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --confirm
          fi